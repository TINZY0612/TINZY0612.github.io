<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦞 OpenClaw Agent Dashboard</title>
<style>
:root {
  --bg: #050604;
  --ink: #f4f1e8;
  --acid: #c9ff3b;
  --amber: #ffb84d;
  --red: #ff6b5f;
  --cyan: #58f0ff;
  --panel: rgba(5,6,4,0.85);
  --line: rgba(201,255,59,0.15);
  --glow: rgba(201,255,59,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'JetBrains Mono','Courier New',monospace;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}
/* Scan lines */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);
  pointer-events:none;
  z-index:100;
  opacity:0.3;
}
/* Particles */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.particle{position:absolute;width:2px;height:2px;background:var(--acid);border-radius:50%;animation:float 8s infinite}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}
/* Header */
.header{
  position:relative;z-index:2;
  padding:24px 32px 16px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(5,6,4,0.95),transparent);
}
.header h1{font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.header h1 span{color:var(--acid)}
.status-dot{width:8px;height:8px;background:var(--acid);border-radius:50%;box-shadow:0 0 10px var(--acid);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.status-text{font-size:11px;color:var(--muted, #b3afa2);margin-left:8px}

/* Main layout */
.main{
  position:relative;z-index:2;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:16px;
  padding:20px 32px;
  height:calc(100vh - 90px);
}
.zone{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px;
  position:relative;
  overflow:hidden;
  transition:all 0.3s;
}
.zone:hover{border-color:var(--glow);box-shadow:0 0 30px rgba(201,255,59,0.1)}
.zone-label{
  font-size:10px;text-transform:uppercase;letter-spacing:3px;
  color:var(--muted, #b3afa2);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.zone-label::before{content:"";width:6px;height:6px;border-radius:50%}
.zone[data-zone="idle"] .zone-label::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.zone[data-zone="working"] .zone-label::before{background:var(--acid);box-shadow:0 0 8px var(--acid)}
.zone[data-zone="hospital"] .zone-label::before{background:var(--red);box-shadow:0 0 8px var(--red)}
.zone[data-zone="meeting"] .zone-label::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.agent-list{display:flex;flex-wrap:wrap;gap:10px}
.agent-card{
  background:rgba(201,255,59,0.05);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 16px;
  min-width:140px;
  transition:all 0.5s;
  position:relative;
  cursor:default;
}
.agent-card.glitch{animation:glitchAnim 0.3s ease}
@keyframes glitchAnim{
  0%,100%{transform:translate(0)}
  20%{transform:translate(-2px,2px)}
  40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,1px)}
  80%{transform:translate(1px,-2px)}
}
.agent-card.working{border-color:var(--acid);box-shadow:0 0 15px rgba(201,255,59,0.2)}
.agent-card.error{border-color:var(--red);box-shadow:0 0 15px rgba(255,107,95,0.2)}
.agent-card.meeting{border-color:var(--cyan);box-shadow:0 0 15px rgba(88,240,255,0.2)}
.agent-name{font-size:13px;font-weight:700;margin-bottom:4px}
.agent-state{font-size:10px;text-transform:uppercase;letter-spacing:1px}
.agent-state[data-state="idle"]{color:var(--amber)}
.agent-state[data-state="working"]{color:var(--acid)}
.agent-state[data-state="error"]{color:var(--red)}
.agent-state[data-state="meeting"]{color:var(--cyan)}
.agent-detail{font-size:9px;color:var(--muted, #b3afa2);margin-top:2px}

/* Empty state */
.empty{color:var(--muted, #b3afa2);font-size:11px;text-align:center;padding:40px;font-style:italic}

/* Footer */
.footer{
  position:fixed;bottom:0;left:0;right:0;
  z-index:2;
  padding:8px 32px;
  border-top:1px solid var(--line);
  background:rgba(5,6,4,0.9);
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--muted, #b3afa2);
}
.footer span{color:var(--acid)}

/* Transition: agent moving */
.agent-card.moving{animation:moveCard 0.5s ease}
@keyframes moveCard{0%{transform:scale(1.05);opacity:0.5}100%{transform:scale(1);opacity:1}}

@media(max-width:768px){
  .main{grid-template-columns:1fr;padding:12px 16px}
  .header{padding:16px;flex-direction:column;gap:8px}
}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="header">
  <div>
    <h1>🦞 <span>OpenClaw</span> Agent Dashboard</h1>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">CONNECTING...</span>
  </div>
</div>

<div class="main">
  <div class="zone" data-zone="idle">
    <div class="zone-label">💤 Idle Zone · 空闲区</div>
    <div class="agent-list" id="idleZone"></div>
  </div>
  <div class="zone" data-zone="working">
    <div class="zone-label">⚡ Working Zone · 工作区</div>
    <div class="agent-list" id="workingZone"></div>
  </div>
  <div class="zone" data-zone="hospital">
    <div class="zone-label">🏥 Hospital Zone · 医院区</div>
    <div class="agent-list" id="hospitalZone"></div>
  </div>
  <div class="zone" data-zone="meeting">
    <div class="zone-label">🤝 Meeting Zone · 会议区</div>
    <div class="agent-list" id="meetingZone"></div>
  </div>
</div>

<div class="footer">
  <span>🦞 OpenClaw Agent Dashboard v1.0</span>
  <span id="updateTime">--</span>
</div>

<script>
// Particles
const particlesEl = document.getElementById('particles');
for(let i=0;i<60;i++){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random()*100+'%';
  p.style.animationDelay = Math.random()*8+'s';
  p.style.animationDuration = 4+Math.random()*8+'s';
  p.style.opacity = Math.random()*0.5+0.1;
  particlesEl.appendChild(p);
}

const API = 'http://20.2.194.55:5182/state';
let agentsState = {};
let prevAgents = {};

function getZone(agent){
  // Determine zone from state
  if(agent.state === 'error') return 'hospital';
  if(agent.state === 'meeting') return 'meeting';
  if(agent.state === 'working') return 'working';
  return 'idle';
}

const zoneNames = {
  meeting:'Meeting Zone · 会议区',
  working:'Working Zone · 工作区',
  hospital:'Hospital Zone · 医院区',
  idle:'Idle Zone · 空闲区'
};

function createAgentCard(agent){
  const card = document.createElement('div');
  card.className = 'agent-card';
  card.dataset.agent = agent.agentId;
  
  const prev = prevAgents[agent.agentId];
  const prevZone = prev ? getZone(prev) : null;
  const newZone = getZone(agent);
  
  if(prevZone && prevZone !== newZone){
    card.classList.add('moving');
    setTimeout(() => card.classList.remove('moving'), 500);
    // Glitch effect on zone change
    card.classList.add('glitch');
    setTimeout(() => card.classList.remove('glitch'), 300);
  }
  
  if(agent.state === 'working') card.classList.add('working');
  if(agent.state === 'error') card.classList.add('error');
  if(agent.state === 'meeting') card.classList.add('meeting');
  
  card.innerHTML = `
    <div class="agent-name">${agent.name || agent.agentId}</div>
    <div class="agent-state" data-state="${agent.state}">${agent.state}</div>
    <div class="agent-detail">${agent.detail || ''}</div>
  `;
  return card;
}

async function fetchState(){
  try{
    const res = await fetch(API + '?t=' + Date.now());
    if(!res.ok) throw new Error('API error');
    const agents = await res.json();
    
    prevAgents = {...agentsState};
    agentsState = {};
    
    // Clear zones
    ['idle','working','hospital','meeting'].forEach(z => {
      document.getElementById(z + 'Zone').innerHTML = '';
    });
    
    // Check for meeting state (agents in same session)
    const sessionMap = {};
    agents.forEach(a => {
      if(a.sessionId) sessionMap[a.sessionId] = (sessionMap[a.sessionId]||0)+1;
    });
    
    let hasContent = false;
    agents.forEach(a => {
      const zone = getZone(a);
      const card = createAgentCard(a);
      document.getElementById(zone + 'Zone').appendChild(card);
      agentsState[a.agentId] = a;
      hasContent = true;
    });
    
    // Show empty states
    ['idle','working','hospital','meeting'].forEach(z => {
      const el = document.getElementById(z + 'Zone');
      if(!el.children.length){
        el.innerHTML = `<div class="empty">-- 暂无 --</div>`;
      }
    });
    
    document.getElementById('statusDot').style.background = 'var(--acid)';
    document.getElementById('statusText').textContent = 'LIVE · ' + agents.length + ' agents';
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-CN');
  }catch(e){
    document.getElementById('statusDot').style.background = 'var(--red)';
    document.getElementById('statusText').textContent = 'OFFLINE';
    console.log('Fetch error:', e.message);
  }
}

// Poll every 5 seconds
fetchState();
setInterval(fetchState, 5000);
</script>
</body>
</html>
