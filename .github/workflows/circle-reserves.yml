name: Refresh Circle reserve income
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-circle-reserve.py'
      - '.github/workflows/circle-reserves.yml'

permissions:
  contents: read

concurrency:
  group: circle-reserve-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public balances and SOFR with coverage checks
        run: python scripts/update-circle-reserve.py
      - name: Commit valid cache and preserve first dated snapshot
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add circle/data/live.json circle/data/forecasts/
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Refresh Circle reserve income snapshot'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request existing GitHub Pages branch build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
